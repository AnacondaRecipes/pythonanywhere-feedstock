{% set name = "pythonanywhere" %}
{% set version = "0.19.3" %}

package:
  name: {{ name }}
  version: {{ version }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  entry_points:
    - pa = cli.pa:app
  skip: true  # [py<310]

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: b6dd931b2086c0f38682b5e2323ddd649b4b023809a1aa602bbdc2e5f6003ed4
  - url: https://github.com/{{ name }}/helper_scripts/archive/refs/tags/v{{ version }}.tar.gz
    sha256: ffa3a215b6a7e965a075f0e3514b39b3768a39919be4bf57d6d42e5d073f343c
    folder: gh_src

requirements:
  host:
    - pip
    - python
    - setuptools >=77.0.3
  run:
    - python
    - docopt
    - packaging
    - python-dateutil
    - pythonanywhere-core >=0.3.3
    - requests
    - schema ==0.7.2
    - snakesay ==0.10.4
    - tabulate
    - typer

# Windows-only failures:
# - the upstream `fake_home` fixture needs $HOME and POSIX symlinks, which Windows lacks
# - the two TestUpload cases assert POSIX path separators
{% set SKIP_TEST_WIN = [
    "--deselect=gh_src/tests/test_django_project.py::TestDetectDjangoVersion",
    "--deselect=gh_src/tests/test_django_project.py::TestDownloadRepo",
    "--deselect=gh_src/tests/test_django_project.py::TestEnsureBranch",
    "--deselect=gh_src/tests/test_django_project.py::TestRunCollectStatic",
    "--deselect=gh_src/tests/test_django_project.py::TestRunMigrate",
    "--deselect=gh_src/tests/test_django_project.py::TestRunStartproject",
    "--deselect=gh_src/tests/test_project.py::test_project_domain_and_python_version",
    "--deselect=gh_src/tests/test_project.py::test_project_path",
    "--deselect=gh_src/tests/test_project.py::test_project_virtualenv",
    "--deselect=gh_src/tests/test_project.py::test_project_webapp",
    "--deselect=gh_src/tests/test_project.py::test_project_wsgi_file_path",
    "--deselect=gh_src/tests/test_project.py::test_sanity_checks_calls_webapp_sanity_checks",
    "--deselect=gh_src/tests/test_project.py::test_sanity_checks_nuke_option_overrides_directory_checks",
    "--deselect=gh_src/tests/test_project.py::test_sanity_checks_raises_if_project_path_exists",
    "--deselect=gh_src/tests/test_project.py::test_sanity_checks_raises_if_virtualenv_exists",
    "--deselect=gh_src/tests/test_project.py::test_start_bash_calls_launch_bash_in_virtualenv_with_unique_id",
    "--deselect=gh_src/tests/test_project.py::test_start_bash_calls_launch_bash_in_virtualenv_with_virtualenv_and_project_path",
    "--deselect=gh_src/tests/test_cli_path.py::TestUpload::test_exits_with_error_when_unsuccessful_upload",
    "--deselect=gh_src/tests/test_cli_path.py::TestUpload::test_exits_with_success_when_successful_upload",
] %}

test:
  source_files:
    - gh_src/tests
    - gh_src/scripts
  imports:
    - cli
    - cli.django
    - cli.pa
    - cli.path
    - cli.schedule
    - cli.students
    - cli.webapp
    - cli.website
    - pythonanywhere
    - pythonanywhere.django_project
    - pythonanywhere.exceptions
    - pythonanywhere.files
    - pythonanywhere.launch_bash_in_virtualenv
    - pythonanywhere.project
    - pythonanywhere.scripts_commons
    - pythonanywhere.students
    - pythonanywhere.task
    - pythonanywhere.utils
    - pythonanywhere.virtualenvs
  requires:
    - pip
    - pytest
    - pytest-mock
    - pytest-xdist
    - psutil
    - responses
  commands:
    - pip check
    - pa --help
    - pytest -n auto -m "not slowtest" -vv --color=yes gh_src/tests  # [not win]
    - pytest -n auto -m "not slowtest" -vv --color=yes gh_src/tests {{ SKIP_TEST_WIN | join(' ') }}  # [win]

about:
  home: https://github.com/pythonanywhere/helper_scripts
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: PythonAnywhere helper tools for users
  description: |
    PythonAnywhere is a collection of helper scripts and command-line tools
    for interacting with the PythonAnywhere cloud platform. It allows users to manage files,
    databases, web apps, scheduled tasks, and virtual environments directly
    from their local terminal.
  dev_url: https://github.com/pythonanywhere/helper_scripts
  doc_url: https://github.com/pythonanywhere/helper_scripts/blob/master/README.md

extra:
  recipe-maintainers:
    - bkreider
    - skupr-anaconda